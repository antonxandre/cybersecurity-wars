<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PromptSec Arena (CyberWars) - Hybrid Flame & Flutter 2D Game">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberWars">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>PromptSec Arena (CyberWars)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #0A0E17;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <script>
    // Inicialização da tela cheia por padrão no primeiro gesto do usuário
    (function() {
      function requestFullscreenOnFirstGesture() {
        var pref = localStorage.getItem('cyberwars_fullscreen');
        if (pref !== 'false') {
          var el = document.documentElement;
          var requestMethod = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
          if (requestMethod && !document.fullscreenElement) {
            try {
              var p = requestMethod.call(el);
              if (p && p.catch) p.catch(function() {});
            } catch (e) {}
          }
        }
      }
      window.addEventListener('click', requestFullscreenOnFirstGesture, { once: true });
      window.addEventListener('pointerdown', requestFullscreenOnFirstGesture, { once: true });
      window.addEventListener('keydown', requestFullscreenOnFirstGesture, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
